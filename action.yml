name: "Commit and Create a Pull Request"
description: "Commit and Create a Pull Request"
inputs:
  github-token:
    description: "The GitHub Token"
    required: true
    default: "${{ github.token }}"
  base-branch:
    description: "The base branch"
    required: true
    default: "${{ github.ref_name }}"
  head-branch:
    description: "The head branch. It must be different from the base branch"
    required: false
  head-branch-prefix:
    description: "The prefix of the head branch"
    required: false
    default: "actions-commit-and-create-pr/"
  title:
    description: "The title of a pull request"
    required: false
  body:
    description: "The body of a pull request"
    required: false
  commit-message:
    description: "The commit message"
    required: false
  working-directory:
    description: "The directory that contains changes to commit"
    required: false
    default: "."
  skip-duplicate:
    description: "Skip creating a pull request if an open pull request into the base branch has the same changes"
    required: false
    default: "true"
outputs:
  commit-url:
    description: "The URL of a commit created"
  commit-sha:
    description: "The SHA of a commit created"
  head-branch:
    description: "The name of the head branch created"
  pr-url:
    description: "The URL of a pull request created"
  pr-number:
    description: "The number of a pull request created"
  duplicated:
    description: "true if creating a pull request is skipped because an open pull request has the same changes"
runs:
  using: "node24"
  main: "dist/index.js"

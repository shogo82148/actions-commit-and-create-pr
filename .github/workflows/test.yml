name: test
on:
  push:
    branches-ignore:
      - "actions-commit/*"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HEAD_BRANCH: "actions-commit/${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/
        with:
          github-token: "this token should be not used because there is no changes"
      - name: make some changes
        run: ./testdata/update.sh
        shell: bash
      - id: commit
        uses: $/
        with:
          head-branch: ${{ env.HEAD_BRANCH }}
          # other jobs and concurrent runs make the same changes.
          skip-duplicate: false
          labels: |
            documentation
            enhancement, documentation
      - name: verify
        run: ./testdata/verify.sh "$COMMIT_SHA" "$HEAD_BRANCH" "$BASE_BRANCH" "$PR_URL"
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit-sha }}
          BASE_BRANCH: ${{ github.ref_name }}
          PR_URL: ${{ steps.commit.outputs.pr-url }}
          GH_TOKEN: ${{ github.token }}
      - name: verify labels
        run: |
          set -ue
          LABELS=$(gh pr view "$PR_URL" --json labels --jq '[.labels[].name] | sort | join(",")')
          if [[ "$LABELS" != "documentation,enhancement" ]]; then
              echo "::error::labels are not matched. expected: documentation,enhancement, actual: $LABELS"
              exit 1
          fi
          echo "labels are OK."
        shell: bash
        env:
          PR_URL: ${{ steps.commit.outputs.pr-url }}
          GH_TOKEN: ${{ github.token }}
      - name: cleanup
        if: always()
        run: ./testdata/cleanup.sh "$HEAD_BRANCH"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  test-file-modes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HEAD_BRANCH: "actions-commit/${{ github.run_id }}-${{ github.run_attempt }}-file-modes"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: make some changes
        run: |
          ./testdata/update.sh
          ./testdata/update-file-modes.sh
        shell: bash
      - id: commit
        uses: $/
        with:
          head-branch: ${{ env.HEAD_BRANCH }}
          # other jobs and concurrent runs make the same changes.
          skip-duplicate: false
      - name: verify
        run: ./testdata/verify.sh "$COMMIT_SHA" "$HEAD_BRANCH" "$BASE_BRANCH" "$PR_URL"
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit-sha }}
          BASE_BRANCH: ${{ github.ref_name }}
          PR_URL: ${{ steps.commit.outputs.pr-url }}
          GH_TOKEN: ${{ github.token }}
      - name: cleanup
        if: always()
        run: ./testdata/cleanup.sh "$HEAD_BRANCH"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  # the action should work without credentials persisted by actions/checkout,
  # because it fetches the commit with the github-token input.
  test-without-persisted-credentials:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HEAD_BRANCH: "actions-commit/${{ github.run_id }}-${{ github.run_attempt }}-without-persisted-credentials"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: make some changes
        run: ./testdata/update.sh
        shell: bash
      - id: commit
        uses: $/
        with:
          head-branch: ${{ env.HEAD_BRANCH }}
          # other jobs and concurrent runs make the same changes.
          skip-duplicate: false
      - name: verify
        run: ./testdata/verify.sh "$COMMIT_SHA" "$HEAD_BRANCH" "$BASE_BRANCH" "$PR_URL"
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit-sha }}
          BASE_BRANCH: ${{ github.ref_name }}
          PR_URL: ${{ steps.commit.outputs.pr-url }}
          GH_TOKEN: ${{ github.token }}
      - name: cleanup
        if: always()
        run: ./testdata/cleanup.sh "$HEAD_BRANCH"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  test-skip-duplicate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HEAD_BRANCH: "actions-commit/${{ github.run_id }}-${{ github.run_attempt }}-skip-duplicate"
      DUPLICATED_BRANCH: "actions-commit/${{ github.run_id }}-${{ github.run_attempt }}-skip-duplicate-2"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: make some changes
        run: |
          ./testdata/update.sh
          # make the changes unique, so that pull requests by other jobs are not considered as duplicates.
          echo "$HEAD_BRANCH" > testdata/unique.txt
        shell: bash
      - id: commit
        uses: $/
        with:
          head-branch: ${{ env.HEAD_BRANCH }}
      - name: verify
        run: ./testdata/verify.sh "$COMMIT_SHA" "$HEAD_BRANCH" "$BASE_BRANCH" "$PR_URL"
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit-sha }}
          BASE_BRANCH: ${{ github.ref_name }}
          PR_URL: ${{ steps.commit.outputs.pr-url }}
          GH_TOKEN: ${{ github.token }}

      - name: make the same changes again
        run: |
          git checkout --quiet --detach "$GITHUB_SHA"
          ./testdata/update.sh
          echo "$HEAD_BRANCH" > testdata/unique.txt
        shell: bash
      - id: duplicated
        uses: $/
        with:
          head-branch: ${{ env.DUPLICATED_BRANCH }}
      - name: verify that creating a pull request is skipped
        run: |
          set -ue
          if [[ "$DUPLICATED" != "true" ]]; then
              echo "::error::duplicated is not true: $DUPLICATED"
              exit 1
          fi
          if [[ "$PR_URL" != "$EXPECTED_PR_URL" || "$OUTPUT_HEAD_BRANCH" != "$HEAD_BRANCH" ]]; then
              echo "::error::the outputs don't point to the existing pull request: $PR_URL $OUTPUT_HEAD_BRANCH"
              exit 1
          fi
          if [[ -n "$COMMIT_SHA" ]]; then
              echo "::error::a commit is created: $COMMIT_SHA"
              exit 1
          fi
          if [[ -n "$(git ls-remote --heads origin "refs/heads/$DUPLICATED_BRANCH")" ]]; then
              echo "::error::the branch $DUPLICATED_BRANCH is created."
              exit 1
          fi
          echo "skipping is OK."
        shell: bash
        env:
          DUPLICATED: ${{ steps.duplicated.outputs.duplicated }}
          PR_URL: ${{ steps.duplicated.outputs.pr-url }}
          OUTPUT_HEAD_BRANCH: ${{ steps.duplicated.outputs.head-branch }}
          COMMIT_SHA: ${{ steps.duplicated.outputs.commit-sha }}
          EXPECTED_PR_URL: ${{ steps.commit.outputs.pr-url }}
      - name: cleanup
        if: always()
        run: |
          ./testdata/cleanup.sh "$HEAD_BRANCH"
          ./testdata/cleanup.sh "$DUPLICATED_BRANCH"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  test-close-superseded:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      OLD_BRANCH: "actions-commit/${{ github.run_id }}-${{ github.run_attempt }}-close-superseded-old"
      NEW_BRANCH: "actions-commit/${{ github.run_id }}-${{ github.run_attempt }}-close-superseded-new"
      # use a unique group, so that pull requests by concurrent runs are not closed.
      GROUP: "test-close-superseded-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: make some changes
        run: |
          ./testdata/update.sh
          echo "$OLD_BRANCH" > testdata/unique.txt
        shell: bash
      - id: old
        uses: $/
        with:
          head-branch: ${{ env.OLD_BRANCH }}
          group: ${{ env.GROUP }}
          close-superseded: true

      - name: make different changes
        run: |
          git checkout --quiet --detach "$GITHUB_SHA"
          ./testdata/update.sh
          echo "$NEW_BRANCH" > testdata/unique.txt
        shell: bash
      - id: new
        uses: $/
        with:
          head-branch: ${{ env.NEW_BRANCH }}
          group: ${{ env.GROUP }}
          close-superseded: true
      - name: verify the new pull request
        run: ./testdata/verify.sh "$COMMIT_SHA" "$NEW_BRANCH" "$BASE_BRANCH" "$PR_URL"
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.new.outputs.commit-sha }}
          BASE_BRANCH: ${{ github.ref_name }}
          PR_URL: ${{ steps.new.outputs.pr-url }}
          GH_TOKEN: ${{ github.token }}
      - name: verify that the old pull request is closed
        run: |
          set -ue
          if [[ "$OLD_CLOSED" != "[]" ]]; then
              echo "::error::the first run closed pull requests: $OLD_CLOSED"
              exit 1
          fi
          if [[ "$NEW_CLOSED" != "[$OLD_PR_NUMBER]" ]]; then
              echo "::error::closed-pull-requests is not matched. expected: [$OLD_PR_NUMBER], actual: $NEW_CLOSED"
              exit 1
          fi
          STATE=$(gh pr view "$OLD_PR_NUMBER" --json state --jq '.state')
          if [[ "$STATE" != "CLOSED" ]]; then
              echo "::error::the old pull request is not closed: $STATE"
              exit 1
          fi
          COMMENTS=$(gh pr view "$OLD_PR_NUMBER" --json comments --jq '.comments[].body')
          if [[ "$COMMENTS" != *"superseded by #$NEW_PR_NUMBER"* ]]; then
              echo "::error::the old pull request doesn't have the comment: $COMMENTS"
              exit 1
          fi
          if [[ -n "$(git ls-remote --heads origin "refs/heads/$OLD_BRANCH")" ]]; then
              echo "::error::the branch $OLD_BRANCH is not deleted."
              exit 1
          fi
          echo "closing is OK."
        shell: bash
        env:
          OLD_PR_NUMBER: ${{ steps.old.outputs.pr-number }}
          OLD_CLOSED: ${{ steps.old.outputs.closed-pull-requests }}
          NEW_PR_NUMBER: ${{ steps.new.outputs.pr-number }}
          NEW_CLOSED: ${{ steps.new.outputs.closed-pull-requests }}
          GH_TOKEN: ${{ github.token }}
      - name: cleanup
        if: always()
        run: |
          ./testdata/cleanup.sh "$OLD_BRANCH"
          ./testdata/cleanup.sh "$NEW_BRANCH"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

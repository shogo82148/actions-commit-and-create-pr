name: test
on:
  push:
    branches-ignore:
      - "actions-commit/*"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HEAD_BRANCH: "actions-commit/${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/
        with:
          github-token: "this token should be not used because there is no changes"
      - name: make some changes
        run: ./testdata/update.sh
        shell: bash
      - id: commit
        uses: $/
        with:
          head-branch: ${{ env.HEAD_BRANCH }}
      - name: verify
        run: ./testdata/verify.sh "$COMMIT_SHA" "$HEAD_BRANCH" "$BASE_BRANCH" "$PR_URL"
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit-sha }}
          BASE_BRANCH: ${{ github.ref_name }}
          PR_URL: ${{ steps.commit.outputs.pr-url }}
          GH_TOKEN: ${{ github.token }}
      - name: cleanup
        if: always()
        run: ./testdata/cleanup.sh "$HEAD_BRANCH"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  test-file-modes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HEAD_BRANCH: "actions-commit/${{ github.run_id }}-${{ github.run_attempt }}-file-modes"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: make some changes
        run: |
          ./testdata/update.sh
          ./testdata/update-file-modes.sh
        shell: bash
      - id: commit
        uses: $/
        with:
          head-branch: ${{ env.HEAD_BRANCH }}
      - name: verify
        run: ./testdata/verify.sh "$COMMIT_SHA" "$HEAD_BRANCH" "$BASE_BRANCH" "$PR_URL"
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit-sha }}
          BASE_BRANCH: ${{ github.ref_name }}
          PR_URL: ${{ steps.commit.outputs.pr-url }}
          GH_TOKEN: ${{ github.token }}
      - name: cleanup
        if: always()
        run: ./testdata/cleanup.sh "$HEAD_BRANCH"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  # the action should work without credentials persisted by actions/checkout,
  # because it fetches the commit with the github-token input.
  test-without-persisted-credentials:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HEAD_BRANCH: "actions-commit/${{ github.run_id }}-${{ github.run_attempt }}-without-persisted-credentials"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: make some changes
        run: ./testdata/update.sh
        shell: bash
      - id: commit
        uses: $/
        with:
          head-branch: ${{ env.HEAD_BRANCH }}
      - name: verify
        run: ./testdata/verify.sh "$COMMIT_SHA" "$HEAD_BRANCH" "$BASE_BRANCH" "$PR_URL"
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit-sha }}
          BASE_BRANCH: ${{ github.ref_name }}
          PR_URL: ${{ steps.commit.outputs.pr-url }}
          GH_TOKEN: ${{ github.token }}
      - name: cleanup
        if: always()
        run: ./testdata/cleanup.sh "$HEAD_BRANCH"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
